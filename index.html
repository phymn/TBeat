<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TBeat</title>
<style>
body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,system-ui,sans-serif;text-align:center}
h1{margin:10px 0 4px;font-size:22px}#wrap{position:relative;max-width:640px;margin:0 auto}
video,#ov{width:100%;display:block;border-radius:10px}#ov{position:absolute;top:0;left:0}
video{transform:scaleX(-1)}#ov.mir{transform:scaleX(-1)}video.nomir{transform:none}
#bpm{font-size:64px;font-weight:700;margin:6px 0 0}#conf{font-size:16px;color:#8b949e}
.High{color:#3fb950!important}.Med{color:#d29922!important}.Low{color:#f85149!important}
button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:10px 14px;margin:4px;font-size:15px}
#prog{height:8px;background:#21262d;border-radius:4px;margin:6px 16px}#pb{height:100%;width:0;background:#58a6ff;border-radius:4px}
#wave{width:calc(100% - 32px);height:80px;background:#161b22;border-radius:8px}
#status{font-size:13px;color:#8b949e;min-height:18px;margin:4px 10px}#warn{color:#f85149;font-weight:600;min-height:20px}
#note{font-size:12px;color:#d29922;margin:8px}
</style></head><body>
<h1>♥ TBeat</h1>
<div id="wrap"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas></div>
<div id="bpm">—</div><div id="conf">Confidence: —</div>
<div id="hint">Hold still ~10 s, face the camera, good steady light</div>
<div id="prog"><div id="pb"></div></div>
<canvas id="wave"></canvas>
<div id="warn"></div>
<div><button id="start">Start</button><button id="stop">Stop</button><button id="sw">Switch camera</button><button id="csv">Export CSV</button></div>
<div id="status">Loading models…</div>
<div id="note">Estimate only, not a medical device. Video never leaves this device.</div>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script id="dsp">
// TBeat DSP — original MIT-licensed code. POS: Wang et al. 2017.
var FS=30;
function resample(s,fs){ // s:[{t(ms),r,g,b}] -> uniform arrays
  var t0=s[0].t,t1=s[s.length-1].t,n=Math.floor((t1-t0)/1000*fs)+1,R=[],G=[],B=[],j=0;
  for(var i=0;i<n;i++){var t=t0+i*1000/fs;while(j<s.length-2&&s[j+1].t<t)j++;
    var a=s[j],b=s[j+1]||a,d=b.t-a.t,f=d>0?Math.min(1,Math.max(0,(t-a.t)/d)):0;
    R.push(a.r+(b.r-a.r)*f);G.push(a.g+(b.g-a.g)*f);B.push(a.b+(b.b-a.b)*f);}
  return {R:R,G:G,B:B};
}
function pos(R,G,B,fs){var n=R.length,L=Math.round(1.6*fs),H=new Array(n).fill(0);
  for(var m=0;m+L<=n;m++){var mr=0,mg=0,mb=0,k;for(k=m;k<m+L;k++){mr+=R[k];mg+=G[k];mb+=B[k];}
    mr/=L;mg/=L;mb/=L;if(!mr||!mg||!mb)continue;var S1=[],S2=[],s1=0,s2=0;
    for(k=m;k<m+L;k++){var r=R[k]/mr,g=G[k]/mg,b=B[k]/mb,x=g-b,y=-2*r+g+b;S1.push(x);S2.push(y);s1+=x;s2+=y;}
    s1/=L;s2/=L;var v1=0,v2=0;for(k=0;k<L;k++){v1+=(S1[k]-s1)*(S1[k]-s1);v2+=(S2[k]-s2)*(S2[k]-s2);}
    var al=v2>0?Math.sqrt(v1/v2):0,h=[],hm=0;for(k=0;k<L;k++){h.push(S1[k]+al*S2[k]);hm+=h[k];}hm/=L;
    for(k=0;k<L;k++)H[m+k]+=h[k]-hm;}
  return H;}
function detrend(x){var n=x.length,sx=0,sy=0,sxy=0,sxx=0;for(var i=0;i<n;i++){sx+=i;sy+=x[i];sxy+=i*x[i];sxx+=i*i;}
  var b=(n*sxy-sx*sy)/(n*sxx-sx*sx||1),a=(sy-b*sx)/n;return x.map(function(v,i){return v-a-b*i;});}
function biquad(x,b0,b1,b2,a1,a2){var y=[],x1=0,x2=0,y1=0,y2=0;for(var i=0;i<x.length;i++){var o=b0*x[i]+b1*x1+b2*x2-a1*y1-a2*y2;x2=x1;x1=x[i];y2=y1;y1=o;y.push(o);}return y;}
function bandpass(x,fs,lo,hi){ // 2nd-order HP + 2nd-order LP, forward-backward
  function hp(x){var w=Math.tan(Math.PI*lo/fs),q=Math.SQRT1_2,n=1/(1+w/q+w*w);return biquad(x,n,-2*n,n,2*(w*w-1)*n,(1-w/q+w*w)*n);}
  function lp(x){var w=Math.tan(Math.PI*hi/fs),q=Math.SQRT1_2,n=1/(1+w/q+w*w);return biquad(x,w*w*n,2*w*w*n,w*w*n,2*(w*w-1)*n,(1-w/q+w*w)*n);}
  var y=lp(hp(x));y=lp(hp(y.reverse())).reverse();return y;}
function fftMag(x){var n=1;while(n<x.length*4)n<<=1;var re=new Float64Array(n),im=new Float64Array(n),N=x.length;
  for(var i=0;i<N;i++)re[i]=x[i]*(0.5-0.5*Math.cos(2*Math.PI*i/(N-1)));
  for(var i=1,j=0;i<n;i++){var bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){var t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
  for(var len=2;len<=n;len<<=1){var ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(var i=0;i<n;i+=len){var cr=1,ci=0;for(var k=0;k<len/2;k++){var a=i+k,b=a+len/2,tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;
      re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;var t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t;}}}
  var m=new Float64Array(n/2);for(var i=0;i<n/2;i++)m[i]=re[i]*re[i]+im[i]*im[i];return {mag:m,df:FS/n};}
function estimate(samples,fs){fs=fs||FS;if(samples.length<fs*5)return null;var u=resample(samples,fs);
  var h=bandpass(detrend(pos(u.R,u.G,u.B,fs)),fs,0.7,3.0),F=fftMag(h),best=0,bi=-1,tot=0;
  var lo=Math.ceil(0.7/F.df),hi=Math.floor(3.0/F.df);for(var i=lo;i<=hi;i++){tot+=F.mag[i];if(F.mag[i]>best){best=F.mag[i];bi=i;}}
  if(bi<0||tot<=0)return null;var sig=0;for(var i=lo;i<=hi;i++){var f=i*F.df,f0=bi*F.df;if(Math.abs(f-f0)<0.1||Math.abs(f-2*f0)<0.1)sig+=F.mag[i];}
  var p=bi;if(bi>lo&&bi<hi){var a=F.mag[bi-1],b=F.mag[bi],c=F.mag[bi+1],d=a-2*b+c;if(d)p=bi+0.5*(a-c)/d;}
  return {bpm:p*F.df*60,snr:10*Math.log10(sig/Math.max(1e-12,tot-sig)),signal:h};}
if(typeof module!=='undefined')module.exports={estimate:estimate,FS:FS};
</script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},v=$('v'),ov=$('ov'),ctx=ov.getContext('2d'),wave=$('wave'),wctx=wave.getContext('2d');
var off=document.createElement('canvas'),octx=off.getContext('2d',{willReadFrequently:true});
var facing='user',stream=null,running=false,modelsOk=false,box=null,lastDet=0,detBusy=false;
var buf=[],rois={f:[],l:[],r:[]},est=[],log=[],lastBright=null,jumps=[],moves=[],lastBox=null,t0=0,lastEst=0,lastSig=null;
function st(m,err){$('status').textContent=m;$('status').style.color=err?'#f85149':'#8b949e';}
window.onerror=function(m){st('Error: '+m,true);};
async function loadModels(){try{var u='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
  await faceapi.tf.setBackend('webgl').catch(function(){});await faceapi.tf.ready();
  await faceapi.nets.tinyFaceDetector.loadFromUri(u);modelsOk=true;st('Ready. Tap Start.');}catch(e){st('Model load failed: '+e.message,true);}}
async function openCam(){if(stream)stream.getTracks().forEach(function(t){t.stop();});
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}});
  v.srcObject=stream;await v.play();v.className=facing==='user'?'':'nomir';ov.className=facing==='user'?'mir':'';
  ov.width=v.videoWidth;ov.height=v.videoHeight;var sc=Math.min(1,320/v.videoWidth);off.width=Math.round(v.videoWidth*sc);off.height=Math.round(v.videoHeight*sc);}
function reset(){buf=[];rois={f:[],l:[],r:[]};est=[];jumps=[];moves=[];lastBright=null;lastBox=null;t0=performance.now();$('bpm').textContent='—';setConf(null);}
async function start(){if(!modelsOk){st('Models not loaded yet',true);return;}try{if(!stream)await openCam();reset();running=true;st('Measuring… hold still');loop();}catch(e){st('Camera error: '+e.message,true);}}
function stop(){running=false;st('Stopped');}
function detect(){if(detBusy)return;detBusy=true;var sc=off.width/v.videoWidth;
  faceapi.detectSingleFace(off,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.4})).then(function(d){
    if(d){var b=d.box;box={x:b.x/sc,y:b.y/sc,w:b.width/sc,h:b.height/sc};}else box=null;}).catch(function(e){st('Detect error: '+e.message,true);}).finally(function(){detBusy=false;});}
function roiList(b){return {f:{x:b.x+b.w*.3,y:b.y+b.h*.08,w:b.w*.4,h:b.h*.15},l:{x:b.x+b.w*.15,y:b.y+b.h*.5,w:b.w*.2,h:b.h*.18},r:{x:b.x+b.w*.65,y:b.y+b.h*.5,w:b.w*.2,h:b.h*.18}};}
function avg(r,sc){var x=Math.max(0,Math.round(r.x*sc)),y=Math.max(0,Math.round(r.y*sc)),w=Math.min(off.width-x,Math.round(r.w*sc)),h=Math.min(off.height-y,Math.round(r.h*sc));
  if(w<2||h<2)return null;var d=octx.getImageData(x,y,w,h).data,R=0,G=0,B=0,n=0;
  for(var i=0;i<d.length;i+=4){var r_=d[i],g=d[i+1],b=d[i+2],cb=128-.1687*r_-.3313*g+.5*b,cr=128+.5*r_-.4187*g-.0813*b;
    if(cb>=77&&cb<=127&&cr>=133&&cr<=173){R+=r_;G+=g;B+=b;n++;}}
  return n>w*h*.2?{r:R/n,g:G/n,b:B/n}:null;}
function frame(){if(!running)return;var now=performance.now();
  octx.drawImage(v,0,0,off.width,off.height);
  if(now-lastDet>333){lastDet=now;detect();}
  ctx.clearRect(0,0,ov.width,ov.height);$('warn').textContent='';
  if(box){var R=roiList(box),sc=off.width/v.videoWidth;ctx.lineWidth=3;ctx.strokeStyle='#58a6ff';ctx.strokeRect(box.x,box.y,box.w,box.h);
    ctx.strokeStyle='#3fb950';['f','l','r'].forEach(function(k){ctx.strokeRect(R[k].x,R[k].y,R[k].w,R[k].h);});
    if(R.l.w*sc<10){$('warn').textContent='Too far — move closer';}
    var a={f:avg(R.f,sc),l:avg(R.l,sc),r:avg(R.r,sc)},parts=[a.f,a.l,a.r].filter(Boolean);
    if(parts.length){var s={t:now,r:0,g:0,b:0};parts.forEach(function(p){s.r+=p.r/parts.length;s.g+=p.g/parts.length;s.b+=p.b/parts.length;});buf.push(s);
      ['f','l','r'].forEach(function(k){if(a[k])rois[k].push({t:now,r:a[k].r,g:a[k].g,b:a[k].b});});
      var br=(s.r+s.g+s.b)/3;if(lastBright!==null&&Math.abs(br-lastBright)>8)jumps.push(now);lastBright=br;}
    if(lastBox){var mv=Math.hypot(box.x-lastBox.x,box.y-lastBox.y)/box.w;if(mv>.05)moves.push(now);}lastBox={x:box.x,y:box.y,w:box.w};
  }else $('warn').textContent='No face found';
  var cut=now-20000;buf=buf.filter(function(s){return s.t>cut;});for(var k in rois)rois[k]=rois[k].filter(function(s){return s.t>cut;});
  $('pb').style.width=Math.min(100,(now-t0)/100)+'%';
  if(now-lastEst>1000){lastEst=now;compute(now);}
  drawWave();
  if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(frame);else requestAnimationFrame(frame);}
function loop(){if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(frame);else requestAnimationFrame(frame);}
function setConf(c){var e=$('conf');e.className=c||'';e.textContent='Confidence: '+(c||'—');}
function compute(now){var w=now-10000,s=buf.filter(function(x){return x.t>w;});var r=estimate(s,FS);if(!r)return;lastSig=r.signal;
  var per=['f','l','r'].map(function(k){var e=estimate(rois[k].filter(function(x){return x.t>w;}),FS);return e&&e.bpm;}).filter(Boolean);
  var agree=per.filter(function(b){return Math.abs(b-r.bpm)<8;}).length;
  var mv=moves.filter(function(t){return t>w;}).length,jp=jumps.filter(function(t){return t>w;}).length;
  var score=(r.snr>0?2:r.snr>-3?1:0)+(agree>=2?1:0)-(mv>3?1:0)-(jp>2?1:0);
  var conf=score>=3?'High':score>=2?'Med':'Low';
  est.push(r.bpm);if(est.length>5)est.shift();var m=est.slice().sort(function(a,b){return a-b;})[Math.floor(est.length/2)];
  if(now-t0<10000){setConf(null);return;}
  $('bpm').textContent=conf==='Low'?'—':Math.round(m)+' bpm';setConf(conf);
  log.push([new Date().toISOString(),Math.round(m),conf,r.snr.toFixed(1)]);
  st('SNR '+r.snr.toFixed(1)+' dB · ROI agree '+agree+'/'+per.length+' · moves '+mv+' · light jumps '+jp);}
function drawWave(){var W=wave.width=wave.clientWidth*devicePixelRatio,H=wave.height=80*devicePixelRatio;wctx.clearRect(0,0,W,H);
  if(!lastSig)return;var x=lastSig,mx=Math.max.apply(null,x.map(Math.abs))||1;wctx.strokeStyle='#f85149';wctx.lineWidth=2;wctx.beginPath();
  x.forEach(function(y,i){var px=i/(x.length-1)*W,py=H/2-y/mx*H*.45;i?wctx.lineTo(px,py):wctx.moveTo(px,py);});wctx.stroke();}
$('start').onclick=start;$('stop').onclick=stop;
$('sw').onclick=async function(){facing=facing==='user'?'environment':'user';var was=running;running=false;try{await openCam();if(was){reset();running=true;loop();}}catch(e){st('Camera error: '+e.message,true);}};
$('csv').onclick=function(){var t='timestamp,bpm,confidence,snr_db\n'+log.map(function(r){return r.join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='tbeat-'+Date.now()+'.csv';a.click();};
if(!window.faceapi)st('face-api failed to load (check internet)',true);else loadModels();
})();
</script>
</body></html>
